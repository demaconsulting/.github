<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The organization profile hero banner: the DEMA Tools family of families. Six families (Continuous
       Compliance, Documentation, Architecture and Diagrams, AI, Libraries, Utilities) sit around
       the DEMA Tools pill: the top three feed it and the bottom three come out of it.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size: 76px">Tool</text>
  <text class="word brandText" x="233.6" y="176" style="font-size: 76px">Families</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Open .NET tool families</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">for quality software.</text>
  <text class="body" x="58" y="368">Six families of .NET tools, libraries</text>
  <text class="body" x="58" y="402">and apps for compliance, documents,</text>
  <text class="body" x="58" y="436">diagrams, AI agents and utilities.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">dotnet tool search</text>
  <text class="cmd file" x="138" y="539">DemaConsulting</text>
  <text class="note" x="58" y="604">Open source &#183; MIT &#183; on NuGet</text>

  <!-- Top row: three clusters flow into the engine -->
  <g>
    <!-- Continuous Compliance: a pipeline of passing stages -->
    <rect class="card" x="580" y="40" width="319" height="160" rx="16"/>
    <rect x="683.5" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="303" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <line x1="44" y1="38" x2="264" y2="38" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="3"/>
      <g fill="#0a1022" stroke-width="2.5">
        <circle cx="44" cy="38" r="16" stroke="#fbbf24"/>
        <circle cx="99" cy="38" r="16" stroke="#22d3ee"/>
        <circle cx="154" cy="38" r="16" stroke="#f472b6"/>
        <circle cx="209" cy="38" r="16" stroke="#60a5fa"/>
        <circle cx="264" cy="38" r="16" stroke="#5eead4"/>
      </g>
      <g fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M37,38 L42,43 L51,33"/>
        <path d="M92,38 L97,43 L106,33"/>
        <path d="M147,38 L152,43 L161,33"/>
        <path d="M202,38 L207,43 L216,33"/>
        <path d="M257,38 L262,43 L271,33"/>
      </g>
      <rect x="91" y="68" width="122" height="32" rx="16" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
      <text class="mini" x="152" y="91" fill="#bbf7d0" text-anchor="middle">pass</text>
    </g>
    <text class="label" x="739.5" y="190">Continuous Compliance</text>

    <!-- Documentation: a page and the checks that run on it -->
    <rect class="card" x="911" y="40" width="318" height="160" rx="16"/>
    <rect x="1014" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="919" y="48" width="302" height="112" rx="10"/>
    <g transform="translate(919 48)">
      <path class="page" d="M24 12 L68 12 L84 28 L84 100 L24 100 Z"/>
      <path d="M68 12 L68 28 L84 28 Z" fill="#cbd5e1"/>
      <rect x="34" y="40" width="40" height="5" rx="2.5" fill="#f472b6"/>
      <rect class="bar" x="34" y="52" width="40" height="5" rx="2.5"/>
      <rect class="bar" x="34" y="64" width="30" height="5" rx="2.5"/>
      <rect class="bar" x="34" y="76" width="36" height="5" rx="2.5"/>
      <rect x="120" y="10" width="150" height="28" rx="14" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="195" y="31" fill="#a5f3fc" text-anchor="middle">lint</text>
      <rect x="120" y="42" width="150" height="28" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="mini" x="195" y="63" fill="#fbcfe8" text-anchor="middle">STE100</text>
      <rect x="120" y="74" width="150" height="28" rx="14" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-width="1.5"/>
      <text class="mini" x="195" y="95" fill="#99f6e4" text-anchor="middle">API docs</text>
    </g>
    <text class="label" x="1070" y="190">Documentation</text>

    <!-- Architecture and Diagrams: a layered diagram -->
    <rect class="card" x="1241" y="40" width="319" height="160" rx="16"/>
    <rect x="1344.5" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1249" y="48" width="303" height="112" rx="10"/>
    <g transform="translate(1249 48)">
      <path d="M152 34 L152 52 M80 52 L224 52 M80 52 L80 70 M224 52 L224 70" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="82" y="6" width="140" height="28" rx="7" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="mini" x="152" y="27" fill="#fbcfe8" text-anchor="middle">Workbench</text>
      <rect x="20" y="70" width="120" height="28" rx="7" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="80" y="91" fill="#a5f3fc" text-anchor="middle">SysML2</text>
      <rect x="164" y="70" width="120" height="28" rx="7" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-width="1.5"/>
      <text class="mini" x="224" y="91" fill="#99f6e4" text-anchor="middle">Render</text>
    </g>
    <text class="label" x="1400.5" y="190">Architecture &amp; Diagrams</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M740,206 C740,236 990,226 990,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M1070,206 C1070,236 1070,226 1070,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1400,206 C1400,236 1150,226 1150,253" stroke="#f472b6" marker-end="url(#headPink)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="740" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="1070" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1400" cy="206" r="5" fill="#f472b6"/>
  </g>
  <!-- The engine: the DEMA Tools family of families -->
  <rect x="740" y="262" width="660" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="740" y="262" width="660" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="764" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M773 282 L786 282 L792 288 L792 306 L773 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="777" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="777" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="777" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="816" y="305">DEMA Tools</text>
  <line x1="1024" y1="278" x2="1024" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1044" y="303">.NET tools &#183; libraries &#183; apps</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M1000,330 C1000,356 740,356 740,381" marker-end="url(#headMint)"/>
    <path d="M1070,330 C1070,356 1070,356 1070,381" marker-end="url(#headMint)"/>
    <path d="M1140,330 C1140,356 1400,356 1400,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="1000" cy="330" r="5"/>
    <circle cx="1070" cy="330" r="5"/>
    <circle cx="1140" cy="330" r="5"/>
  </g>

  <!-- Bottom row: three more clusters come out of the engine -->
  <g>
    <!-- AI: a friendly agent and its messages -->
    <rect class="card" x="580" y="390" width="319" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="303" height="152" rx="10"/>
    <g transform="translate(588 398)">
      <path d="M110 36 L110 20" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
      <circle cx="110" cy="14" r="7" fill="#f472b6"/>
      <rect x="46" y="64" width="12" height="34" rx="6" fill="#a78bfa"/>
      <rect x="162" y="64" width="12" height="34" rx="6" fill="#a78bfa"/>
      <rect x="58" y="36" width="104" height="90" rx="20" fill="url(#brand)"/>
      <circle cx="87" cy="74" r="10" fill="#ffffff"/>
      <circle cx="133" cy="74" r="10" fill="#ffffff"/>
      <circle cx="89" cy="76" r="4" fill="#1e293b"/>
      <circle cx="135" cy="76" r="4" fill="#1e293b"/>
      <rect x="90" y="102" width="40" height="7" rx="3.5" fill="#ffffff"/>
      <rect x="190" y="30" width="96" height="38" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="miniMono" x="238" y="56" fill="#e2e8f0" text-anchor="middle">task</text>
      <rect x="190" y="84" width="96" height="38" rx="12" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
      <text class="miniMono" x="238" y="110" fill="#bbf7d0" text-anchor="middle">done</text>
    </g>
    <text class="label" x="739.5" y="585">AI</text>

    <!-- Libraries: packages that plug into other projects -->
    <rect class="card" x="911" y="390" width="318" height="210" rx="16"/>
    <rect class="panel" x="919" y="398" width="302" height="152" rx="10"/>
    <g transform="translate(919 398)">
      <path d="M151 22 L195 47 L151 72 L107 47 Z" fill="#99f6e4"/>
      <path d="M107 47 L151 72 L151 126 L107 101 Z" fill="#2dd4bf"/>
      <path d="M151 72 L195 47 L195 101 L151 126 Z" fill="#0f766e"/>
      <path d="M129 34.5 L173 59.5" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 60 L84 75 L58 90 L32 75 Z" fill="#ddd6fe"/>
      <path d="M32 75 L58 90 L58 122 L32 107 Z" fill="#8b5cf6"/>
      <path d="M58 90 L84 75 L84 107 L58 122 Z" fill="#5b21b6"/>
      <path d="M244 60 L270 75 L244 90 L218 75 Z" fill="#bfdbfe"/>
      <path d="M218 75 L244 90 L244 122 L218 107 Z" fill="#3b82f6"/>
      <path d="M244 90 L270 75 L270 107 L244 122 Z" fill="#1d4ed8"/>
    </g>
    <text class="label" x="1070" y="585">Libraries</text>

    <!-- Utilities: gears that keep things running -->
    <rect class="card" x="1241" y="390" width="319" height="210" rx="16"/>
    <rect class="panel" x="1249" y="398" width="303" height="152" rx="10"/>
    <g transform="translate(1249 398)">
      <circle cx="110" cy="76" r="52" fill="none" stroke="#fbbf24" stroke-width="16" stroke-dasharray="13.6 13.6"/>
      <circle cx="110" cy="76" r="44" fill="#fbbf24"/>
      <circle cx="110" cy="76" r="30" fill="none" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="110" cy="76" r="18" fill="#0a1022"/>
      <circle cx="222" cy="112" r="30" fill="none" stroke="#22d3ee" stroke-width="12" stroke-dasharray="11.8 11.8"/>
      <circle cx="222" cy="112" r="25" fill="#22d3ee"/>
      <circle cx="222" cy="112" r="10" fill="#0a1022"/>
    </g>
    <text class="label" x="1400.5" y="585">Utilities</text>
  </g>
</svg>
