<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1662" viewBox="0 0 1600 1662">
  <!-- The Continuous Compliance group card: the family name and purpose, its 15 project cards in three rows of five
       (embedded from docs/images/projects/, not copied), the pipeline that shows how they work together, and a
       legend for the kind dots. The definitions and the background follow the shared DEMA Consulting hero
       (docs/images/hero.svg). This file is docs/images/group-continuous-compliance.svg, beside its rendered .png.
       Layout: cards of 240x270 with 16px gutters, rows at y = 206, 492, and 778, each row centered. The pipeline
       (six stages with their tools, and the two rules that cover every stage) is drawn at 1.2x from y = 1160. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .body { font: 28px sans-serif; fill: #cbd5e1; }
      .sub { font: bold 28px sans-serif; fill: #a5b4fc; }
      .brandText { fill: url(#brand); }
      .mini { font: bold 22px sans-serif; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .stage { font: bold 22px sans-serif; fill: #f8fafc; text-anchor: middle; }
      .tool { font: 22px sans-serif; fill: #cbd5e1; text-anchor: middle; }
      .kind { font: 22px sans-serif; fill: #94a3b8; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="1662" fill="url(#bg)"/>
  <ellipse cx="250" cy="120" rx="420" ry="260" fill="url(#glowViolet)"/>
  <ellipse cx="1000" cy="560" rx="620" ry="320" fill="url(#glowCyan)"/>
  <ellipse cx="500" cy="1330" rx="620" ry="320" fill="url(#glowViolet)"/>
  <ellipse cx="1480" cy="1630" rx="380" ry="240" fill="url(#glowPink)"/>
  <rect width="1600" height="1662" fill="url(#dots)"/>

  <!-- Family name and purpose -->
  <text class="word brandText" x="48" y="108" style="font-size: 80px">Continuous Compliance</text>
  <rect x="54" y="132" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="body" x="54" y="180">Turn every CI run into evidence: lint, test, analyze, trace, review, and release.</text>

  <!-- Row one -->
  <image href="projects/reqstream.svg" x="168" y="206" width="240" height="270"/>
  <image href="projects/reviewmark.svg" x="424" y="206" width="240" height="270"/>
  <image href="projects/reviewcenter.svg" x="680" y="206" width="240" height="270"/>
  <image href="projects/buildmark.svg" x="936" y="206" width="240" height="270"/>
  <image href="projects/versionmark.svg" x="1192" y="206" width="240" height="270"/>
  <!-- Row two -->
  <image href="projects/sarifmark.svg" x="168" y="492" width="240" height="270"/>
  <image href="projects/sonarmark.svg" x="424" y="492" width="240" height="270"/>
  <image href="projects/apimark.svg" x="680" y="492" width="240" height="270"/>
  <image href="projects/fileassert.svg" x="936" y="492" width="240" height="270"/>
  <image href="projects/vhdltest.svg" x="1192" y="492" width="240" height="270"/>
  <!-- Row three -->
  <image href="projects/sysml2tools.svg" x="168" y="778" width="240" height="270"/>
  <image href="projects/lintmark.svg" x="424" y="778" width="240" height="270"/>
  <image href="projects/textlint.svg" x="680" y="778" width="240" height="270"/>
  <image href="projects/ste100mark.svg" x="936" y="778" width="240" height="270"/>
  <image href="projects/spdxtool.svg" x="1192" y="778" width="240" height="270"/>

  <!-- Divider and the title of the pipeline -->
  <line x1="48" y1="1092" x2="1552" y2="1092" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <text class="sub" x="48" y="1140">How they work together</text>

  <!-- The pipeline: six stages in a flow, each with the tools that run in it -->
  <g transform="translate(-484 1100) scale(1.2)">
    <g class="flow">
      <path d="M677.5,66 L798.5,66" stroke="#fbbf24" marker-end="url(#headAmber)"/>
      <path d="M842.5,66 L963.5,66" stroke="#22d3ee" marker-end="url(#headCyan)"/>
      <path d="M1007.5,66 L1128.5,66" stroke="#f472b6" marker-end="url(#headPink)"/>
      <path d="M1172.5,66 L1293.5,66" stroke="#60a5fa" marker-end="url(#headBlue)"/>
      <path d="M1337.5,66 L1458.5,66" stroke="#a78bfa" marker-end="url(#headViolet)"/>
    </g>
    <g fill="#0a1022" stroke-width="2.5">
      <circle cx="657.5" cy="66" r="16" stroke="#fbbf24"/>
      <circle cx="822.5" cy="66" r="16" stroke="#22d3ee"/>
      <circle cx="987.5" cy="66" r="16" stroke="#f472b6"/>
      <circle cx="1152.5" cy="66" r="16" stroke="#60a5fa"/>
      <circle cx="1317.5" cy="66" r="16" stroke="#a78bfa"/>
      <circle cx="1482.5" cy="66" r="16" stroke="#5eead4"/>
    </g>
    <g fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M651.5,66 L656.5,71 L665.5,61"/>
      <path d="M816.5,66 L821.5,71 L830.5,61"/>
      <path d="M981.5,66 L986.5,71 L995.5,61"/>
      <path d="M1146.5,66 L1151.5,71 L1160.5,61"/>
      <path d="M1311.5,66 L1316.5,71 L1325.5,61"/>
      <path d="M1476.5,66 L1481.5,71 L1490.5,61"/>
    </g>

    <rect class="card" x="580" y="104" width="155" height="218" rx="14"/>
    <rect x="601.5" y="104" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <text class="stage" x="657.5" y="157">Lint docs</text>
    <line x1="596" y1="186" x2="719" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="657.5" y="218">LintMark</text>
    <text class="tool" x="657.5" y="248">TextLint</text>
    <text class="tool" x="657.5" y="278">Ste100Mark</text>

    <rect class="card" x="745" y="104" width="155" height="218" rx="14"/>
    <rect x="766.5" y="104" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <text class="stage" x="822.5" y="157">Test</text>
    <line x1="761" y1="186" x2="884" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="822.5" y="218">FileAssert</text>
    <text class="tool" x="822.5" y="248">VHDLTest</text>

    <rect class="card" x="910" y="104" width="155" height="218" rx="14"/>
    <rect x="931.5" y="104" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <text class="stage" x="987.5" y="157">Analyze</text>
    <line x1="926" y1="186" x2="1049" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="987.5" y="218">SarifMark</text>
    <text class="tool" x="987.5" y="248">SonarMark</text>

    <rect class="card" x="1075" y="104" width="155" height="218" rx="14"/>
    <rect x="1096.5" y="104" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <text class="stage" x="1152.5" y="157">Trace</text>
    <line x1="1091" y1="186" x2="1214" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="1152.5" y="218">ReqStream</text>
    <text class="tool" x="1152.5" y="248">SysML2Tools</text>

    <rect class="card" x="1240" y="104" width="155" height="218" rx="14"/>
    <rect x="1261.5" y="104" width="112" height="3" rx="1.5" fill="#a78bfa"/>
    <text class="stage" x="1317.5" y="157">Review</text>
    <line x1="1256" y1="186" x2="1379" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="1317.5" y="218">ReviewMark</text>
    <text class="tool" x="1317.5" y="248">ReviewCenter</text>

    <rect class="card" x="1405" y="104" width="155" height="218" rx="14"/>
    <rect x="1426.5" y="104" width="112" height="3" rx="1.5" fill="#5eead4"/>
    <text class="stage" x="1482.5" y="144">Release</text>
    <text class="stage" x="1482.5" y="170">evidence</text>
    <line x1="1421" y1="186" x2="1544" y2="186" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="tool" x="1482.5" y="218">BuildMark</text>
    <text class="tool" x="1482.5" y="248">VersionMark</text>
    <text class="tool" x="1482.5" y="278">ApiMark</text>
    <text class="tool" x="1482.5" y="308">SpdxTool</text>

    <text class="kind" x="582" y="362">Every tool self-validates through <tspan fill="#5eead4" font-weight="bold">TestResults</tspan></text>
    <text class="kind" x="582" y="394">Every library documents its API with <tspan fill="#5eead4" font-weight="bold">ApiMark</tspan></text>
  </g>

  <!-- Legend for the kind dots -->
  <g>
    <text class="mini" x="48" y="1628" fill="#94a3b8">Kind:</text>
    <circle cx="150" cy="1620" r="8" fill="#5eead4"/>
    <text class="mini" x="166" y="1628" fill="#94a3b8">library</text>
    <circle cx="278" cy="1620" r="8" fill="#60a5fa"/>
    <text class="mini" x="294" y="1628" fill="#94a3b8">tool</text>
    <circle cx="378" cy="1620" r="8" fill="#f472b6"/>
    <text class="mini" x="394" y="1628" fill="#94a3b8">app</text>
    <circle cx="470" cy="1620" r="8" fill="#a78bfa"/>
    <text class="mini" x="486" y="1628" fill="#94a3b8">definitions</text>
  </g>
</svg>
