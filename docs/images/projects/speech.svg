<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The Speech project card (a library): a microphone and waveform becoming text, and text becoming a speaker.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#4ade80"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: mic and waveform into text, then text into a speaker -->
  <g transform="translate(20 24)">
    <!-- Row 1: microphone, waveform, text page -->
    <rect x="28" y="16" width="36" height="56" rx="18" fill="#4ade80"/>
    <path d="M20 50 A26 26 0 0 0 72 50" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <rect x="43" y="76" width="6" height="12" fill="#4ade80"/>
    <rect x="30" y="86" width="32" height="6" rx="3" fill="#4ade80"/>
    <rect x="86" y="46" width="8" height="12" rx="4" fill="#22d3ee"/>
    <rect x="100" y="34" width="8" height="36" rx="4" fill="#22d3ee"/>
    <rect x="114" y="22" width="8" height="60" rx="4" fill="#22d3ee"/>
    <rect x="128" y="38" width="8" height="28" rx="4" fill="#22d3ee"/>
    <path d="M148 52 L162 52 M156 44 L164 52 L156 60" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="page" x="176" y="22" width="84" height="60" rx="12"/>
    <rect x="190" y="36" width="56" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="190" y="54" width="40" height="9" rx="4.5"/>

    <!-- Row 2: text page, arrow, speaker with sound arcs -->
    <rect class="page" x="20" y="130" width="84" height="60" rx="12"/>
    <rect x="34" y="144" width="56" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="34" y="162" width="40" height="9" rx="4.5"/>
    <path d="M116 160 L130 160 M124 152 L132 160 L124 168" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 146 L168 146 L192 124 L192 196 L168 174 L150 174 Z" fill="#4ade80" stroke="#4ade80" stroke-width="6" stroke-linejoin="round"/>
    <path d="M208 142 Q226 160 208 178" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <path d="M224 126 Q254 160 224 194" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Project name -->
  <text class="name" x="160" y="296">Speech</text>

  <!-- Kind dots: library and tool -->
  <circle cx="142" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
  <circle cx="142" cy="342" r="8" fill="#5eead4"/>
  <circle cx="178" cy="342" r="14" fill="#60a5fa" fill-opacity="0.22"/>
  <circle cx="178" cy="342" r="8" fill="#60a5fa"/>
</svg>
