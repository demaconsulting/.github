<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The AgentKit project card (a library): a friendly bot head snapped onto colorful provider blocks.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#f472b6"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: a bot head snapped onto three provider blocks -->
  <g transform="translate(20 24)">
    <!-- Antenna -->
    <rect x="136" y="16" width="8" height="26" rx="4" fill="#cbd5e1"/>
    <circle cx="140" cy="16" r="9" fill="#f472b6"/>
    <!-- Ears -->
    <rect x="62" y="64" width="20" height="36" rx="7" fill="#f472b6"/>
    <rect x="198" y="64" width="20" height="36" rx="7" fill="#f472b6"/>
    <!-- Head -->
    <rect class="page" x="76" y="38" width="128" height="88" rx="22"/>
    <circle cx="112" cy="80" r="15" fill="#1e293b"/>
    <circle cx="168" cy="80" r="15" fill="#1e293b"/>
    <circle cx="116" cy="76" r="6" fill="#22d3ee"/>
    <circle cx="172" cy="76" r="6" fill="#22d3ee"/>
    <path d="M122 106 Q140 120 158 106" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- Neck plug -->
    <rect x="124" y="126" width="32" height="14" fill="#94a3b8"/>
    <!-- Provider blocks with studs -->
    <rect x="30" y="140" width="64" height="12" rx="3" fill="#22d3ee"/>
    <rect x="40" y="134" width="14" height="8" rx="2" fill="#22d3ee"/>
    <rect x="70" y="134" width="14" height="8" rx="2" fill="#22d3ee"/>
    <rect x="30" y="148" width="64" height="48" rx="10" fill="#22d3ee"/>
    <rect x="108" y="140" width="64" height="12" rx="3" fill="#fbbf24"/>
    <rect x="118" y="134" width="14" height="8" rx="2" fill="#fbbf24"/>
    <rect x="148" y="134" width="14" height="8" rx="2" fill="#fbbf24"/>
    <rect x="108" y="148" width="64" height="48" rx="10" fill="#fbbf24"/>
    <rect x="186" y="140" width="64" height="12" rx="3" fill="#4ade80"/>
    <rect x="196" y="134" width="14" height="8" rx="2" fill="#4ade80"/>
    <rect x="226" y="134" width="14" height="8" rx="2" fill="#4ade80"/>
    <rect x="186" y="148" width="64" height="48" rx="10" fill="#4ade80"/>
    <!-- Plug prongs on each block -->
    <rect x="46" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
    <rect x="70" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
    <rect x="124" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
    <rect x="148" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
    <rect x="202" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
    <rect x="226" y="162" width="8" height="20" rx="3" fill="#0a1022" fill-opacity="0.55"/>
  </g>

  <!-- Project name -->
  <text class="name" x="160" y="296">AgentKit</text>

  <!-- Kind dot: library -->
  <circle cx="160" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#5eead4"/>
</svg>
