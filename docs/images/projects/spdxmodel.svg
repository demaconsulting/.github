<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The SpdxModel project card (a library): an object model tree, Document to Packages to Files, with an SPDX badge. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#f472b6"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: a class-box tree, Document to Packages to Files, with an SPDX badge -->
  <g transform="translate(20 24)">
    <!-- Connectors -->
    <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M140 60 V75 H76 V91"/>
      <path d="M140 60 V75 H204 V91"/>
      <path d="M76 135 V150 H46 V166"/>
      <path d="M76 135 V150 H106 V166"/>
      <path d="M204 135 V150 H174 V166"/>
      <path d="M204 135 V150 H234 V166"/>
    </g>

    <!-- SPDX badge -->
    <rect x="12" y="16" width="76" height="40" rx="12" fill="#f472b6"/>
    <text class="mini ink" x="50" y="44" text-anchor="middle">SPDX</text>

    <!-- Document -->
    <rect x="98" y="16" width="84" height="44" rx="10" fill="#3a1d45" stroke="#f472b6" stroke-width="4"/>
    <path d="M98 26 A10 10 0 0 1 108 16 L172 16 A10 10 0 0 1 182 26 L182 34 L98 34 Z" fill="#f472b6"/>
    <rect x="110" y="43" width="44" height="8" rx="4" fill="#fbcfe8" fill-opacity="0.7"/>

    <!-- Packages -->
    <rect x="28" y="91" width="96" height="44" rx="10" fill="#2a2150" stroke="#a78bfa" stroke-width="4"/>
    <path d="M28 101 A10 10 0 0 1 38 91 L114 91 A10 10 0 0 1 124 101 L124 109 L28 109 Z" fill="#a78bfa"/>
    <rect x="40" y="118" width="52" height="8" rx="4" fill="#ddd6fe" fill-opacity="0.7"/>
    <rect x="156" y="91" width="96" height="44" rx="10" fill="#2a2150" stroke="#a78bfa" stroke-width="4"/>
    <path d="M156 101 A10 10 0 0 1 166 91 L242 91 A10 10 0 0 1 252 101 L252 109 L156 109 Z" fill="#a78bfa"/>
    <rect x="168" y="118" width="52" height="8" rx="4" fill="#ddd6fe" fill-opacity="0.7"/>

    <!-- Files -->
    <rect x="19" y="166" width="54" height="40" rx="9" fill="#12303a" stroke="#5eead4" stroke-width="4"/>
    <path d="M19 175 A9 9 0 0 1 28 166 L64 166 A9 9 0 0 1 73 175 L73 182 L19 182 Z" fill="#5eead4"/>
    <rect x="29" y="190" width="30" height="7" rx="3.5" fill="#ccfbf1" fill-opacity="0.7"/>
    <rect x="79" y="166" width="54" height="40" rx="9" fill="#12303a" stroke="#5eead4" stroke-width="4"/>
    <path d="M79 175 A9 9 0 0 1 88 166 L124 166 A9 9 0 0 1 133 175 L133 182 L79 182 Z" fill="#5eead4"/>
    <rect x="89" y="190" width="30" height="7" rx="3.5" fill="#ccfbf1" fill-opacity="0.7"/>
    <rect x="147" y="166" width="54" height="40" rx="9" fill="#12303a" stroke="#5eead4" stroke-width="4"/>
    <path d="M147 175 A9 9 0 0 1 156 166 L192 166 A9 9 0 0 1 201 175 L201 182 L147 182 Z" fill="#5eead4"/>
    <rect x="157" y="190" width="30" height="7" rx="3.5" fill="#ccfbf1" fill-opacity="0.7"/>
    <rect x="207" y="166" width="54" height="40" rx="9" fill="#12303a" stroke="#5eead4" stroke-width="4"/>
    <path d="M207 175 A9 9 0 0 1 216 166 L252 166 A9 9 0 0 1 261 175 L261 182 L207 182 Z" fill="#5eead4"/>
    <rect x="217" y="190" width="30" height="7" rx="3.5" fill="#ccfbf1" fill-opacity="0.7"/>
  </g>

  <!-- Project name -->
  <text class="name" x="160" y="296">SpdxModel</text>

  <!-- Kind dot: library -->
  <circle cx="160" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#5eead4"/>
</svg>
