<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The SysML2Workbench project card (an app): a desktop IDE window showing a SysML v2 block diagram.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#60a5fa"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: an IDE window with a model tree and a block diagram -->
  <g transform="translate(20 24)">
    <rect x="14" y="20" width="252" height="182" rx="14" fill="#161c40" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M14 34 A14 14 0 0 1 28 20 L252 20 A14 14 0 0 1 266 34 L266 48 L14 48 Z" fill="#2a3170"/>
    <circle cx="34" cy="34" r="6" fill="#f87171"/>
    <circle cx="52" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="34" r="6" fill="#4ade80"/>
    <path d="M14 48 L78 48 L78 202 L28 202 A14 14 0 0 1 14 188 Z" fill="#0f1535"/>
    <rect x="26" y="62" width="40" height="8" rx="4" fill="#60a5fa"/>
    <rect x="36" y="80" width="30" height="8" rx="4" fill="#94a3b8"/>
    <rect x="36" y="98" width="34" height="8" rx="4" fill="#94a3b8"/>
    <rect x="26" y="116" width="36" height="8" rx="4" fill="#60a5fa"/>
    <rect x="36" y="134" width="28" height="8" rx="4" fill="#94a3b8"/>

    <path d="M168,92 L168,114 M168,114 L124,114 L124,134 M168,114 L224,114 L224,134" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="62" width="72" height="30" rx="8" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="3"/>
    <rect x="144" y="73" width="48" height="8" rx="4" fill="#bfdbfe"/>
    <rect x="90" y="134" width="68" height="46" rx="8" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6" stroke-width="3"/>
    <rect x="102" y="146" width="44" height="8" rx="4" fill="#fbcfe8"/>
    <rect x="102" y="162" width="30" height="8" rx="4" fill="#fbcfe8" fill-opacity="0.6"/>
    <rect x="190" y="134" width="68" height="46" rx="8" fill="#5eead4" fill-opacity="0.2" stroke="#5eead4" stroke-width="3"/>
    <rect x="202" y="146" width="44" height="8" rx="4" fill="#99f6e4"/>
    <rect x="202" y="162" width="30" height="8" rx="4" fill="#99f6e4" fill-opacity="0.6"/>
  </g>

  <!-- Project name (two lines, because the name has more than 12 characters) -->
  <text class="name2" x="160" y="281">SysML2</text>
  <text class="name2" x="160" y="317">Workbench</text>

  <!-- Kind dot: app -->
  <circle cx="160" cy="342" r="14" fill="#f472b6" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#f472b6"/>
</svg>
