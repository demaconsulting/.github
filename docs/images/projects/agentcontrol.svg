<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The AgentControl project card (an app): a desktop window listing agent profiles with a toggle selecting one.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#22d3ee"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: a window with three agent profiles and one switched on -->
  <g transform="translate(20 24)">
    <rect class="page" x="24" y="14" width="232" height="188" rx="14"/>
    <rect x="24" y="14" width="232" height="36" rx="14" fill="#1e293b"/>
    <rect x="24" y="34" width="232" height="16" fill="#1e293b"/>
    <circle cx="46" cy="32" r="6" fill="#f472b6"/>
    <circle cx="66" cy="32" r="6" fill="#fbbf24"/>
    <circle cx="86" cy="32" r="6" fill="#4ade80"/>

    <!-- Profile 1 (off) -->
    <rect x="36" y="60" width="208" height="40" rx="10" fill="#f1f5f9"/>
    <circle cx="62" cy="80" r="14" fill="#1e293b"/>
    <circle cx="57" cy="78" r="3.5" fill="#22d3ee"/>
    <circle cx="67" cy="78" r="3.5" fill="#22d3ee"/>
    <rect class="bar" x="86" y="76" width="68" height="9" rx="4.5"/>
    <rect x="196" y="70" width="38" height="20" rx="10" fill="#cbd5e1"/>
    <circle cx="206" cy="80" r="8" fill="#ffffff"/>

    <!-- Profile 2 (selected, on) -->
    <rect x="36" y="108" width="208" height="40" rx="10" fill="#cffafe" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="62" cy="128" r="14" fill="#22d3ee"/>
    <circle cx="57" cy="126" r="3.5" fill="#1e293b"/>
    <circle cx="67" cy="126" r="3.5" fill="#1e293b"/>
    <rect x="86" y="124" width="68" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="196" y="118" width="38" height="20" rx="10" fill="#22d3ee"/>
    <circle cx="224" cy="128" r="8" fill="#ffffff"/>

    <!-- Profile 3 (off) -->
    <rect x="36" y="156" width="208" height="40" rx="10" fill="#f1f5f9"/>
    <circle cx="62" cy="176" r="14" fill="#1e293b"/>
    <circle cx="57" cy="174" r="3.5" fill="#22d3ee"/>
    <circle cx="67" cy="174" r="3.5" fill="#22d3ee"/>
    <rect class="bar" x="86" y="172" width="54" height="9" rx="4.5"/>
    <rect x="196" y="166" width="38" height="20" rx="10" fill="#cbd5e1"/>
    <circle cx="206" cy="176" r="8" fill="#ffffff"/>
  </g>

  <!-- Project name (12 characters: 41px) -->
  <text class="name" x="160" y="296" style="font-size: 41px">AgentControl</text>

  <!-- Kind dot: app -->
  <circle cx="160" cy="342" r="14" fill="#f472b6" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#f472b6"/>
</svg>
