<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The DocDown project card (a library): PDF, Word, Excel and PowerPoint files turning into Markdown. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#22d3ee"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: four office files flowing into a Markdown document -->
  <g transform="translate(20 24)">
    <!-- PDF -->
    <path class="page" d="M12 30 L52 30 L72 50 L72 100 L12 100 Z"/>
    <path d="M52 30 L52 50 L72 50 Z" fill="#cbd5e1"/>
    <rect x="18" y="60" width="48" height="30" rx="8" fill="#f472b6"/>
    <text class="mini ink" x="42" y="83" text-anchor="middle">PDF</text>
    <!-- Word -->
    <path class="page" d="M80 30 L120 30 L140 50 L140 100 L80 100 Z"/>
    <path d="M120 30 L120 50 L140 50 Z" fill="#cbd5e1"/>
    <rect x="86" y="60" width="48" height="30" rx="8" fill="#60a5fa"/>
    <text class="mini ink" x="110" y="83" text-anchor="middle">W</text>
    <!-- Excel -->
    <path class="page" d="M12 116 L52 116 L72 136 L72 186 L12 186 Z"/>
    <path d="M52 116 L52 136 L72 136 Z" fill="#cbd5e1"/>
    <rect x="18" y="146" width="48" height="30" rx="8" fill="#4ade80"/>
    <text class="mini ink" x="42" y="169" text-anchor="middle">X</text>
    <!-- PowerPoint -->
    <path class="page" d="M80 116 L120 116 L140 136 L140 186 L80 186 Z"/>
    <path d="M120 116 L120 136 L140 136 Z" fill="#cbd5e1"/>
    <rect x="86" y="146" width="48" height="30" rx="8" fill="#fbbf24"/>
    <text class="mini ink" x="110" y="169" text-anchor="middle">P</text>

    <!-- The arrow -->
    <path d="M148 108 L172 108 M164 96 L176 108 L164 120" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The Markdown document -->
    <path class="page" d="M184 40 L240 40 L268 68 L268 176 L184 176 Z"/>
    <path d="M240 40 L240 68 L268 68 Z" fill="#cbd5e1"/>
    <rect x="192" y="82" width="68" height="46" rx="10" fill="#22d3ee"/>
    <text class="ink" x="212" y="116" text-anchor="middle" font-size="32" font-weight="bold" font-family="sans-serif">M</text>
    <path d="M240 94 L240 116 M230 106 L240 117 L250 106" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="bar" x="194" y="142" width="64" height="8" rx="4"/>
    <rect class="bar" x="194" y="158" width="44" height="8" rx="4"/>
  </g>

  <!-- Project name -->
  <text class="name" x="160" y="296">DocDown</text>

  <!-- Kind dots: library and tool -->
  <circle cx="142" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
  <circle cx="142" cy="342" r="8" fill="#5eead4"/>
  <circle cx="178" cy="342" r="14" fill="#60a5fa" fill-opacity="0.22"/>
  <circle cx="178" cy="342" r="8" fill="#60a5fa"/>
</svg>
