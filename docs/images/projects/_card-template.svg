<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The per-project card template: 320x360. The card is not shown on its own: the group cards
       (docs/images/group-*.svg) embed it with an image element, scaled to 240x270, and the group render
       (docs/images/render-groups.ps1) draws it with the strict option, so there is no PNG for a project card.
       Copy this file to docs/images/projects/{project}.svg (lowercase name), fill the slots, add it to its group
       cards, and render them. To look at a card alone, render it to a temporary folder outside the repository:
       dotnet canvasnet render docs/images/projects/{project}.svg, with the strict, width 640, and transparent
       background options. The definitions, background, frame, panel, and
       positions are FIXED; only the four slots below change.

       SLOT 1, accent color: the 112px-wide bar on the top edge (96px here) and the glow behind the pictograph.
       Pick one palette color per project: #fbbf24 amber, #22d3ee cyan, #f472b6 pink, #60a5fa blue, #a78bfa violet,
       #5eead4 mint, #4ade80 green. Change the bar fill and the stop-color of the "accentGlow" gradient.

       SLOT 2, pictograph: draw it inside the group translate(20 24), a 280x220 coordinate space that is the inner
       panel. Keep it bold and simple: big shapes, few colors, at most one or two short words. It is shown at about
       half size, so any text must be 22px bold or larger and no more than about five letters. Draw in SVG shapes
       only (no raster images). Leave about 14px of padding to the panel edge.

       SLOT 3, project name: bold white, centered at x = 160, in one of two forms. Count the characters of the name.
         ONE LINE (12 characters or fewer): class "name", baseline y = 296, font size
           size = min(48, floor(280000 / sum of the letter advance widths)), at least 22
         using the Arial Bold advances in the hero template (in 1/1000 em): ReqStream 5279 gives 48px and
         CanvasNet 5168 gives 48px.
         TWO LINES (13 characters or more): split at a natural CamelCase boundary, with class "name2" (36px bold)
         on both lines, the first line at baseline y = 281 and the second at baseline y = 317:
           <text class="name2" x="160" y="281">SysML2</text>
           <text class="name2" x="160" y="317">Workbench</text>
         Examples: SysML2 / Workbench, Dictionary / Mark, NuGet / CacheTool, NuGet / Installer. Every line must be at
         most 280px wide: 36 * (letter advance sum) / 1000 is at most 280, that is a sum of at most 7777. If a
         line is wider, split elsewhere. Do not change the size of "name2": 36px is the largest that clears the
         panel above (bottom y = 244) and the kind dot below (top y = 328), and it is the smallest allowed.
         The panel never moves; the card stays 320x360.

       SLOT 4, kind dot: the dot at (160, 342), the same on every card, shows what kind of project it is. The
       colors are fixed:
         library      #5eead4  (mint)
         tool         #60a5fa  (blue)
         app          #f472b6  (pink)
         workflows    #fbbf24  (amber)
         definitions  #a78bfa  (violet)
       Set the fill of both the dot and its ring to the kind color.
       TWO DOTS: a project that ships both a library package and a dotnet tool package (an MSBuild-integration
       package counts as a tool) shows two dots side by side instead of one, library on the left and tool on the
       right, with the same radius (8) and ring (14) as a single dot, centered on x = 160:
         <circle cx="142" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
         <circle cx="142" cy="342" r="8" fill="#5eead4"/>
         <circle cx="178" cy="342" r="14" fill="#60a5fa" fill-opacity="0.22"/>
         <circle cx="178" cy="342" r="8" fill="#60a5fa"/>
       Decide it from the repository's src projects: PackAsTool true is a tool package; a packable project that is
       not a tool and not a test or sample is a library package. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <!-- SLOT 1: the accent color of the glow -->
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- SLOT 1: the accent bar on the top edge -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#a78bfa"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- SLOT 2: the pictograph (placeholder: a page with a plus) -->
  <g transform="translate(20 24)">
    <path class="page" d="M80 36 L166 36 L200 70 L200 184 L80 184 Z"/>
    <path d="M166 36 L166 70 L200 70 Z" fill="#cbd5e1"/>
    <rect x="100" y="90" width="80" height="10" rx="5" fill="#a78bfa"/>
    <rect class="bar" x="100" y="114" width="80" height="8" rx="4"/>
    <rect class="bar" x="100" y="132" width="60" height="8" rx="4"/>
    <circle cx="190" cy="168" r="26" fill="url(#brand)"/>
    <path d="M190 156 L190 180 M178 168 L202 168" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- SLOT 3: the project name (one line here; see the two-line form in the notes above) -->
  <text class="name" x="160" y="296">ProjectName</text>

  <!-- SLOT 4: the kind dot (here the "library" color) -->
  <circle cx="160" cy="342" r="14" fill="#5eead4" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#5eead4"/>
</svg>
