<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The ReviewCenter project card (an app): a browser window showing a code diff with review comments.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 42px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#22d3ee"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: a browser window with removed and added diff lines and review comment bubbles -->
  <g transform="translate(20 24)">
    <rect x="14" y="20" width="252" height="182" rx="14" fill="#161c40" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M14 34 A14 14 0 0 1 28 20 L252 20 A14 14 0 0 1 266 34 L266 48 L14 48 Z" fill="#2a3170"/>
    <circle cx="34" cy="34" r="6" fill="#f87171"/>
    <circle cx="52" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="34" r="6" fill="#4ade80"/>
    <rect x="92" y="27" width="150" height="14" rx="7" fill="#0f1535"/>

    <rect x="24" y="84" width="232" height="24" rx="4" fill="#f87171" fill-opacity="0.3"/>
    <path d="M34 96 L46 96" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
    <rect x="58" y="92" width="90" height="8" rx="4" fill="#fecaca"/>

    <rect x="24" y="110" width="232" height="24" rx="4" fill="#4ade80" fill-opacity="0.3"/>
    <path d="M34 122 L46 122 M40 116 L40 128" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <rect x="58" y="118" width="70" height="8" rx="4" fill="#bbf7d0"/>

    <rect x="24" y="136" width="232" height="24" rx="4" fill="#4ade80" fill-opacity="0.3"/>
    <path d="M34 148 L46 148 M40 142 L40 154" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <rect x="58" y="144" width="100" height="8" rx="4" fill="#bbf7d0"/>

    <rect x="58" y="64" width="60" height="8" rx="4" fill="#475569"/>
    <rect x="58" y="176" width="76" height="8" rx="4" fill="#475569"/>

    <path d="M176 114 Q176 106 184 106 L246 106 Q254 106 254 114 L254 154 Q254 162 246 162 L206 162 L190 178 L190 162 L184 162 Q176 162 176 154 Z" fill="#22d3ee" stroke="#0a1022" stroke-width="3"/>
    <circle cx="198" cy="134" r="6" fill="#0a1022"/>
    <circle cx="215" cy="134" r="6" fill="#0a1022"/>
    <circle cx="232" cy="134" r="6" fill="#0a1022"/>

    <path d="M192 58 Q192 52 198 52 L226 52 Q232 52 232 58 L232 74 Q232 80 226 80 L212 80 L202 90 L202 80 L198 80 Q192 80 192 74 Z" fill="#f472b6" stroke="#0a1022" stroke-width="3"/>
    <path d="M202 66 L222 66" stroke="#0a1022" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Project name (12 characters, one line) -->
  <text class="name" x="160" y="296">ReviewCenter</text>

  <!-- Kind dot: app -->
  <circle cx="160" cy="342" r="14" fill="#f472b6" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#f472b6"/>
</svg>
