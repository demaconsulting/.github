<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360">
  <!-- The SpdxTool project card (a tool): an SBOM document with an SPDX badge linked to a package dependency tree.
       Built from docs/images/projects/_card-template.svg; see the slot notes there. -->
  <defs>
    <style>
      .name { font: bold 48px sans-serif; fill: #ffffff; text-anchor: middle; }
      .name2 { font: bold 36px sans-serif; fill: #ffffff; text-anchor: middle; }
      .mini { font: bold 22px sans-serif; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="cardGlowViolet" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowPink" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- The card: deep gradient, soft glows, a dot grid, and a thin rim -->
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowViolet)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#cardGlowPink)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="318" height="358" rx="24" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="112" y="1" width="96" height="4" rx="2" fill="#60a5fa"/>

  <!-- The inner panel and the glow behind the pictograph -->
  <rect x="20" y="24" width="280" height="220" rx="16" fill="#0a1022" stroke="#ffffff" stroke-opacity="0.06"/>
  <ellipse cx="160" cy="134" rx="130" ry="100" fill="url(#accentGlow)"/>

  <!-- Pictograph: an SPDX document linked to a dependency tree of packages -->
  <g transform="translate(20 24)">
    <path d="M100 64 H146 M168 78 V104 M168 104 H130 V128 M168 104 H214 V128 M130 150 V170 M214 150 V170" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="page" d="M16 34 L82 34 L100 52 L100 190 L16 190 Z"/>
    <path d="M82 34 L82 52 L100 52 Z" fill="#cbd5e1"/>
    <rect x="22" y="62" width="72" height="30" rx="8" fill="#60a5fa"/>
    <text class="mini ink" x="58" y="84" text-anchor="middle">SPDX</text>
    <rect class="bar" x="26" y="108" width="64" height="8" rx="4"/>
    <rect class="bar" x="26" y="126" width="48" height="8" rx="4"/>
    <rect class="bar" x="26" y="144" width="56" height="8" rx="4"/>
    <rect class="bar" x="26" y="162" width="40" height="8" rx="4"/>

    <circle cx="168" cy="62" r="20" fill="#60a5fa" stroke="#0a1022" stroke-width="3"/>
    <circle cx="130" cy="140" r="16" fill="#a78bfa" stroke="#0a1022" stroke-width="3"/>
    <circle cx="214" cy="140" r="16" fill="#f472b6" stroke="#0a1022" stroke-width="3"/>
    <circle cx="130" cy="180" r="12" fill="#5eead4" stroke="#0a1022" stroke-width="3"/>
    <circle cx="214" cy="180" r="12" fill="#fbbf24" stroke="#0a1022" stroke-width="3"/>
  </g>

  <!-- Project name -->
  <text class="name" x="160" y="296">SpdxTool</text>

  <!-- Kind dot: tool -->
  <circle cx="160" cy="342" r="14" fill="#60a5fa" fill-opacity="0.22"/>
  <circle cx="160" cy="342" r="8" fill="#60a5fa"/>
</svg>
